name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Siapkan proyek
        run: | if [ -f project.zip ]; then mkdir -p build_src unzip -q -o project.zip -d build_src echo "DIR=build_src" >> "$GITHUB_ENV" else echo "DIR=." >> "$GITHUB_ENV" fi 
      - name: Build APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TheUnseen-APK
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
