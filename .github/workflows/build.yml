              -alias upload -keypass android123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Upload,O=Local,C=ID"
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          KEYSTORE_PATH: ${{ env.PROJECT_DIR }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Kumpulkan APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi
          mkdir -p dist
          NAME="NexusGGUF-${BUILD_TYPE}-${{ github.run_number }}.apk"
          cp "$APK" "dist/$NAME"
          echo "APK_FILE=dist/$NAME" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusGGUF-${{ env.BUILD_TYPE }}-apk
          path: dist/*.apk
          if-no-files-found: error

      # APK bisa diunduh langsung dari tab Releases (lebih mudah dari HP).
      - name: Publikasikan ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "$APK_FILE" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "NexusGGUF build #${{ github.run_number }} (${BUILD_TYPE})" \
            --notes "APK ${BUILD_TYPE} otomatis dari commit ${{ github.sha }}"
